<!DOCTYPE html>
<html>
<head>
    <title>Eaglercraft Client Builder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Eaglercraft Client Builder</h1>
        <p class="subtitle">Create custom Eaglercraft 1.8 WASM clients</p>
        <p class="stats" id="stats">Clients built: <span id="clientCount">0</span></p>
        
        <div class="builder-grid">
            <!-- Basic Settings -->
            <div class="section">
                <h3>🎮 Basic Configuration</h3>
                <label>Client Name:</label>
                <input type="text" id="clientName" value="CustomClient" placeholder="Enter client name">
                
                <label>Default Username:</label>
                <input type="text" id="username" value="Player" placeholder="Player">
                
                <label>World Seed:</label>
                <input type="number" id="seed" value="-343522682" placeholder="Enter seed">
            </div>
            
            <!-- Hacks -->
            <div class="section">
                <h3>⚡ Hacks & Features</h3>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="fly"> Flight</label>
                    <label><input type="checkbox" id="fullbright"> Fullbright</label>
                    <label><input type="checkbox" id="xray"> X-Ray</label>
                    <label><input type="checkbox" id="nofall"> No Fall Damage</label>
                    <label><input type="checkbox" id="speed"> Speed Hack</label>
                    <label><input type="checkbox" id="killaura"> KillAura</label>
                </div>
                <label>KillAura Range: <span id="rangeDisplay">3</span></label>
                <input type="range" id="killauraRange" min="1" max="6" value="3">
            </div>
            
            <!-- Servers -->
            <div class="section">
                <h3>🌐 Multiplayer Servers</h3>
                <div id="serverList">
                    <div class="server-entry">
                        <input type="text" placeholder="Server name" value="Example Server">
                        <input type="text" placeholder="wss://server.example.com" value="wss://play.example.com">
                        <button type="button" onclick="removeServer(this)">Remove</button>
                    </div>
                </div>
                <button type="button" onclick="addServer()">+ Add Server</button>
            </div>
            
            <!-- Appearance -->
            <div class="section">
                <h3>🎨 Appearance & Branding</h3>
                <label>Background Color:</label>
                <input type="color" id="bgColor" value="#0f172a">
                
                <label>MOTD (Message of the Day):</label>
                <textarea id="motd" rows="3" placeholder="Custom Eaglercraft 1.8 - Hacks Enabled!">Custom Eaglercraft 1.8</textarea>
                
                <label>Splash Text:</label>
                <input type="text" id="splashText" value="Hacks Ready!" placeholder="Bottom screen text">
                
                <label>Texture Pack:</label>
                <select id="texturePack">
                    <option value="">Default (Vanilla)</option>
                    <option value="faithful">Faithful 32x</option>
                    <option value="pvp">PvP Pack</option>
                    <option value="modern">Modern Textures</option>
                </select>
            </div>
        </div>
        
        <div id="preview">
            <div id="preview-content">
                Configure your client above ↑<br>
                <small>Preview updates live</small>
            </div>
        </div>
        
        <button id="download">🚀 Generate & Download Client File</button>
        <div id="output"></div>
    </div>

    <script>
    // builder.js - Perfect for your styles.css
    document.addEventListener('DOMContentLoaded', function() {
        // Live preview
        ['clientName','username','seed','fly','fullbright','xray','nofall','speed','killaura','killauraRange','bgColor','motd','splashText','texturePack']
        .forEach(id => document.getElementById(id)?.addEventListener('input', updatePreview));
        
        document.getElementById('killauraRange').addEventListener('input', function() {
            document.getElementById('rangeDisplay').textContent = this.value;
            updatePreview();
        });
        
        // Global functions
        window.addServer = addServer;
        window.removeServer = removeServer;
        window.buildClient = buildClient;
        updatePreview();
        updateStats();
    });

    function updatePreview() {
        const name = document.getElementById('clientName').value || 'Custom Client';
        const hacks = getEnabledHacks();
        const servers = document.querySelectorAll('.server-entry').length;
        const motd = document.getElementById('motd').value.substring(0, 30) + (document.getElementById('motd').value.length > 30 ? '...' : '');
        
        document.getElementById('preview-content').innerHTML = `
            <strong>${name}</strong><br>
            <small>${hacks.join(', ') || 'No hacks'} • ${servers} server${servers === 1 ? '' : 's'} • ${motd}</small>
        `;
    }

    function getEnabledHacks() {
        return ['fly','fullbright','xray','nofall','speed','killaura']
            .filter(id => document.getElementById(id).checked)
            .map(id => id.charAt(0).toUpperCase() + id.slice(1));
    }

    function addServer() {
        const serverList = document.getElementById('serverList');
        const entry = document.createElement('div');
        entry.className = 'server-entry';
        entry.innerHTML = `
            <input type="text" placeholder="Server name">
            <input type="text" placeholder="wss://server.example.com">
            <button type="button" onclick="removeServer(this)">Remove</button>
        `;
        serverList.appendChild(entry);
        updatePreview();
    }

    function removeServer(btn) {
        btn.parentElement.remove();
        updatePreview();
    }

    function updateStats() {
        const count = parseInt(localStorage.getItem('clientCount') || 0);
        document.getElementById('clientCount').textContent = count;
    }

    // MAIN BUILD - Downloads modded copy, base.html untouched
    async function buildClient() {
        const output = document.getElementById('output');
        const downloadBtn = document.getElementById('download');
        
        output.style.display = 'block';
        output.className = '';
        downloadBtn.disabled = true;
        downloadBtn.textContent = 'Building...';
        output.innerHTML = '🔄 Fetching base.html → Creating modded copy...';

        try {
            // Collect settings
            const clientName = document.getElementById('clientName').value.replace(/[^a-zA-Z0-9_-]/g, '') || 'Client';
            const username = document.getElementById('username').value || 'Player';
            const seed = parseInt(document.getElementById('seed').value) || 12345;
            const bgColor = document.getElementById('bgColor').value;
            const motd = document.getElementById('motd').value || 'Custom Client';
            const splashText = document.getElementById('splashText').value || 'Ready!';
            const texturePack = document.getElementById('texturePack').value;
            const killauraRange = parseInt(document.getElementById('killauraRange').value) || 3;

            const hacks = {
                fly: document.getElementById('fly').checked,
                fullbright: document.getElementById('fullbright').checked,
                xray: document.getElementById('xray').checked,
                nofall: document.getElementById('nofall').checked,
                speed: document.getElementById('speed').checked,
                killaura: document.getElementById('killaura').checked ? killauraRange : 0
            };

            const servers = Array.from(document.querySelectorAll('.server-entry')).map(entry => {
                const inputs = entry.querySelectorAll('input');
                return {
                    name: inputs[0].value.trim(),
                    url: inputs[1].value.trim()
                };
            }).filter(s => s.name && s.url);

            const config = {
                title: clientName,
                motd: motd,
                username: username,
                seed: seed,
                servers: servers,
                assets: texturePack,
                backgroundColor: bgColor,
                splash: splashText,
                cheatsEnabled: true,
                cheats: hacks
            };

            output.innerHTML += '\n✅ Settings collected';

            // Fetch ORIGINAL base.html
            const res = await fetch('/base.html');
            if (!res.ok) throw new Error('/public/base.html missing!\nDownload Eaglercraft WASM → save index.html there');

            let html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');

            // Inject into COPY (original untouched)
            const script = doc.createElement('script');
            script.textContent = `window.eaglerConfig=${JSON.stringify(config)};
console.log("🎮 ${clientName} loaded:", window.eaglerConfig);
setTimeout(()=>{document.body.style.background='${bgColor}';},100);`;
            doc.head.appendChild(script);

            doc.title = `${clientName} - ${splashText}`;

            html = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;

            // DOWNLOAD MODDED COPY
            const blob = new Blob([html], {type: 'text/html;charset=utf-8'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${clientName}.html`;
            a.click();
            URL.revokeObjectURL(a.href);

            // Success
            output.className = 'success';
            const hacksList = getEnabledHacks().join(', ') || 'None';
            output.innerHTML = `✅ ${clientName}.html DOWNLOADED!

📁 /base.html = UNCHANGED (original)
🎮 ${clientName}.html = YOUR MODS

Hacks: ${hacksList}
Servers: ${servers.length}
Size: ${(html.length/1e6).toFixed(1)}MB

F12 → "🎮 CustomClient loaded" = ✅ WORKING`;

            // Stats
            const count = parseInt(localStorage.getItem('clientCount') || 0) + 1;
            localStorage.setItem('clientCount', count);
            document.getElementById('clientCount').textContent = count;
            document.getElementById('stats').innerHTML = `Clients built: <strong>${count}</strong>`;

        } catch(e) {
            output.className = 'error';
            output.innerHTML = `❌ ${e.message}`;
        } finally {
            downloadBtn.disabled = false;
            downloadBtn.textContent = '🚀 Generate & Download Client File';
        }
    }
    </script>
</body>
</html>
