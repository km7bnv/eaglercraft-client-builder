<!DOCTYPE html>
<html>
<head>
    <title>Eaglercraft Client Builder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Eaglercraft Client Builder</h1>
        <p class="subtitle">Create custom Eaglercraft 1.8</p>
        <p class="stats" id="stats">Preview size: <span id="size">Ready</span></p>
        
        <div class="builder-grid">
            <!-- Basic Settings -->
            <div class="section">
                <h3>Basic Configuration</h3>
                <label>Client Name:</label>
                <input type="text" id="clientName" placeholder="Enter client name">
                
                <label>Default Username:</label>
                <input type="text" id="username" placeholder="Enter username">
                
                <label>Default World Seed:</label>
                <input type="number" id="seed" placeholder="Enter seed">
            </div>
            
            <!-- Features -->
            <div class="section">
                <h3>Features</h3>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="fly"> Flight</label>
                    <label><input type="checkbox" id="fullbright"> Fullbright</label>
                    <label><input type="checkbox" id="xray"> X-Ray Vision</label>
                    <label><input type="checkbox" id="nofall"> No Fall Damage</label>
                    <label><input type="checkbox" id="speed"> Speed</label>
                    <label><input type="checkbox" id="killaura"> KillAura</label>
                </div>
                <label>KillAura Range:</label>
                <input type="range" id="killauraRange" min="1" max="6" value="3">
            </div>
            
            <!-- Servers -->
            <div class="section">
                <h3>Servers</h3>
                <div id="serverList">
                    <div class="server-entry">
                        <input type="text" placeholder="Server name">
                        <input type="text" placeholder="wss://server.example.com">
                        <button type="button" onclick="removeServer(this)">Remove</button>
                    </div>
                </div>
                <button type="button" onclick="addServer()">Add Server</button>
            </div>
            
            <!-- Appearance -->
            <div class="section">
                <h3>Appearance</h3>
                <label>Background Color:</label>
                <input type="color" id="bgColor" value="#000000">
                
                <label>Message of the Day:</label>
                <textarea id="motd" rows="3" placeholder="Enter MOTD text"></textarea>
                
                <label>Texture Pack:</label>
                <select id="texturePack">
                    <option value="">Default</option>
                    <option value="faithful">Faithful 32x</option>
                    <option value="pvp">PvP Pack</option>
                </select>
            </div>
        </div>
        
        <div id="preview">
            <div id="preview-content">
                Client Preview<br>
                <small>Configure above to see details</small>
            </div>
        </div>
        
        <button id="download" onclick="buildClient()">Generate Client File</button>
        <div id="output"></div>
    </div>

    <script src="builder.js"></script>
</body>
</html>
